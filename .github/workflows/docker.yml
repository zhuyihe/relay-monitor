name: Build & Push Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一个 PR 连着推，上一次还在跑的取消；main 上的不取消（每次推送都要推镜像）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          DB_HOST: build-placeholder

  # 单元测试三个时区各跑一遍（业务时区、跨日、夏令时的问题只在某个时区露出来），三个同时跑
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Shanghai, America/Los_Angeles, UTC]
    name: unit (${{ matrix.tz }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # 界面测试全套：打包好的版本开在 3300、连单独的 MySQL，用 Chrome 跑 tests/reconciliation-ui.test.mjs，4 路同时跑（scripts/ui-lanes.mjs）
  ui:
    runs-on: ubuntu-latest
    # 一路最多 10 分钟（scripts/ui-lanes.mjs），被杀的那一路剩下的再跑最多 10 分钟，加上装依赖、打包约 2 分钟
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ui-root
          MYSQL_DATABASE: relay_monitor_ui
          MYSQL_USER: relay_monitor_ui
          MYSQL_PASSWORD: ci-ui-test
        # 端口写死：job 级 env 里不能用 job.services 取映射出来的端口（GitHub 的机器上 3306 不会撞）
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-ui-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TZ: America/Los_Angeles
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: relay_monitor_ui
      DB_USER: relay_monitor_ui
      DB_PASSWORD: ci-ui-test
      PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
      PLAYWRIGHT_CHANNEL: chrome
      RECONCILIATION_UI_BASE_URL: http://127.0.0.1:3300
      UI_STEP_TIMEOUT_MS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 页面上的中文要有字体，不然量宽度、一行放不放得下的用例不准；Playwright 装在仓库外面，不改 package.json，浏览器用机器上的 Chrome
      - name: CJK fonts and Playwright
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          npm install --prefix /tmp/pw --no-save --no-audit --no-fund playwright@1.64.1
      - run: npm run build
      - run: node db/migrate.js
      - name: Start the built app on 3300
        run: |
          nohup npx next start -p 3300 -H 127.0.0.1 > next-server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:3300/login && break; sleep 1; done
          for p in /login / /stations /my /analytics /reconciliation /usage /notifications /settings; do curl -s -o /dev/null -m 60 "http://127.0.0.1:3300$p"; done
      - run: node scripts/ui-lanes.mjs 4
        env:
          UI_LANES_OUT: ui-lanes-logs
      # 超时被取消（cancelled）时也传：卡死的那次最需要日志
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-lanes-logs
          path: |
            ui-lanes-logs/
            next-server.log

  schema-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-schema-root
          MYSQL_DATABASE: relay_monitor_test
          MYSQL_USER: relay_monitor_test
          MYSQL_PASSWORD: ci-schema-test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-schema-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify migrations and onboarding SQL on isolated MySQL 8
        run: node --test --test-concurrency=1 db/schema.integration.test.js db/upstream-merge.integration.test.js
        env:
          ONBOARDING_SCHEMA_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: relay_monitor_test
          DB_USER: relay_monitor_test
          DB_PASSWORD: ci-schema-test

  # PR 上也真的构建一次镜像（不推送），在镜像里加载迁移脚本用到的模块：
  # 镜像只拷了 standalone 产物、db/ 和 lib/，缺文件时启动第一步 node db/migrate.js 就会退出
  image-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: relay-monitor:smoke
      - name: Migration modules load inside the image
        run: docker run --rm --entrypoint node relay-monitor:smoke --input-type=module -e "await import('/app/db/pool.js'); await import('/app/db/store.js'); console.log('db modules ok')"
      # 密钥丢了时要在镜像里跑的恢复脚本（deploy/README.md「加密密钥丢了怎么办」）
      - name: Secret reset script loads inside the image
        run: docker run --rm --entrypoint node relay-monitor:smoke --input-type=module -e "await import('/app/db/secrets.js'); await import('/app/db/reset-secrets.js'); console.log('secret modules ok')"
      # 合并重复上游以后想改回去要在镜像里跑的脚本（deploy/README.md「合并重复的上游」）；它引用的模块都要在镜像里
      - name: Upstream unmerge script loads inside the image
        run: docker run --rm --entrypoint node relay-monitor:smoke --input-type=module -e "await import('/app/db/k-unmerge.js'); await import('/app/db/upstream-merge-repository.js'); console.log('unmerge modules ok')"
      # 登录限流按连接地址算要用的预加载模块：lib/ 漏拷进镜像时，容器实际启动命令（Dockerfile CMD）会直接起不来，这里当场发现
      - name: Login rate-limit preload module loads inside the image
        run: docker run --rm --entrypoint node relay-monitor:smoke --import /app/lib/peer-address.js --input-type=module -e "console.log('peer-address preload ok')"

  # 渠道 Key 读取服务（agent/）连真库的测试：SQLite 本地就有，MySQL 三种（8.4、5.7、MariaDB：库侧查询时限的写法各不相同）、PostgreSQL 各起一个服务容器。
  # agent/ 自己的依赖（mysql2、pg）装在 agent/node_modules，和镜像里装的一样
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mysql_image: ["mysql:8.4", "mysql:5.7", "mariadb:10.11"]
    services:
      mysql:
        image: ${{ matrix.mysql_image }}
        env:
          MYSQL_ROOT_PASSWORD: ci-agent-root
          MYSQL_DATABASE: relay_key_agent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-agent-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-agent-pg
          POSTGRES_DB: relay_key_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agent
      - run: node --test --test-concurrency=1 --test-timeout=60000 lib/key-fingerprint.test.js agent/dsn.test.js agent/reader.test.js agent/snapshot.test.js agent/server.test.js agent/reader.contract.test.js agent/reader.resilience.test.js agent/reader.isolation.test.js
        env:
          KEY_AGENT_TEST_MYSQL_DSN: mysql://root:ci-agent-root@127.0.0.1:3306/relay_key_agent
          KEY_AGENT_TEST_PG_URL: postgres://postgres:ci-agent-pg@127.0.0.1:5432/relay_key_agent

  # 读取服务镜像：PR 上也真的构建一次（不推送），起来跑 /healthz；secret 太短时要起不来
  agent-image-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          load: true
          tags: relay-key-agent:smoke
      - name: Image size
        run: docker image inspect relay-key-agent:smoke --format 'size={{.Size}} bytes'
      - name: /healthz answers
        run: |
          docker run -d --name key-agent-smoke -p 18790:8790 -e RELAY_KEY_AGENT_SECRET=ciSm0keKd83LmQwRtYx9zPa5vBn7cJf4hGs2 relay-key-agent:smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18790/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18790/healthz | grep -q '"ok":true'
          # 没带令牌的 /keys 回 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18790/keys)" = 401
          docker exec key-agent-smoke node /app/agent/healthcheck.js
          docker logs key-agent-smoke
      # 镜像里两个数据库驱动都要装全（读取服务按需动态加载，缺了要到真连库时才发现）
      - name: Database drivers load inside the image
        run: docker run --rm -w /app --entrypoint node relay-key-agent:smoke --input-type=module -e "await import('mysql2/promise'); await import('pg'); await import('node:sqlite'); console.log('drivers ok')"
      # --dry-run：镜像的入口把参数传给读取服务；没有库可读时打印失败的原因码、退出码 1；一键停（KEY_AGENT_PAUSED）时只说一句、退出码 0
      - name: Dry run prints the reason and exits
        run: |
          set +e
          out=$(docker run --rm -e RELAY_KEY_AGENT_SECRET=ciSm0keKd83LmQwRtYx9zPa5vBn7cJf4hGs2 relay-key-agent:smoke --dry-run 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q '读取：失败，原因码'
          out=$(docker run --rm -e RELAY_KEY_AGENT_SECRET=ciSm0keKd83LmQwRtYx9zPa5vBn7cJf4hGs2 -e KEY_AGENT_PAUSED=1 relay-key-agent:smoke --dry-run 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 0
          echo "$out" | grep -q 'KEY_AGENT_PAUSED'
      # 令牌太短、太弱都要起不来：退出码 1，日志里是那一句、不带令牌；镜像没构建出来、docker 自己报错也是非 1 或没有那句，不会假通过
      - name: Short and weak secrets refuse to start
        run: |
          for secret in too-short "$(printf 'x%.0s' $(seq 1 32))"; do
            set +e
            out=$(docker run --rm -e RELAY_KEY_AGENT_SECRET="$secret" relay-key-agent:smoke 2>&1)
            code=$?
            set -e
            echo "$out"
            test "$code" -eq 1
            echo "$out" | grep -q '令牌太短\|令牌太弱'
            if echo "$out" | grep -q -F "$secret"; then echo "the secret must not be logged"; exit 1; fi
          done

  build:
    needs: [verify, unit, ui, schema-verify, image-smoke, agent, agent-image-smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push key agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-key-agent:latest
            ghcr.io/${{ github.repository }}-key-agent:${{ github.sha }}
          cache-from: type=gha,scope=key-agent
          cache-to: type=gha,mode=max,scope=key-agent

# 服务器部署：面板 + Watchtower 自动更新
# MySQL 随本 compose 启动；数据库账号与密码通过 DB_* 环境变量配置。
# 首次切换 v2：把 v1 的 data/ 目录只读挂载进来并设 V1_DATA_DIR，库为空时启动自动一次性导入。
# 用法：mkdir -p ~/relay-monitor && cp docker-compose.yml ~/relay-monitor/ && cd ~/relay-monitor && docker compose up -d
services:
  relay-monitor:
    image: ghcr.io/zhuyihe/relay-monitor:latest
    container_name: relay-monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 进程时区：只影响日志等本地时间显示
      - TZ=Asia/Shanghai
      # 业务时区：利润、日汇总、热力图、日报的「今天 / 昨天」都按它划日，日报也按它定时发送。
      # 未设置时默认 Asia/Shanghai；旧变量 REPORT_TIME_ZONE 仍兼容。
      - BUSINESS_TIME_ZONE=Asia/Shanghai
      # 仅在可信反向代理覆盖转发头且应用不能被公网直连时启用。
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # 5 分钟内全站登录失败满这个数就全部顶住（防分布式乱试），默认 50；填 0 关掉这道全站上限，只剩单来源的锁。
      # 被打满时怎么恢复见 deploy/README.md「登录失败限流按哪个来源算」
      - LOGIN_SITE_FAILURE_LIMIT=${LOGIN_SITE_FAILURE_LIMIT:-50}
      # ---- MySQL（本 compose 的 db 服务，必填）----
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # ---- 登录信息加密（强烈建议）：在本目录的 .env 里写 RELAY_SECRET_KEY=（openssl rand -base64 32 生成）----
      # 不配就明文保存。密钥要单独备份、别和 mysql-data 放进同一份备份；步骤见 deploy/README.md「登录信息加密」
      - RELAY_SECRET_KEY=${RELAY_SECRET_KEY:-}
      # ---- v1 数据一次性迁移（可选）：导入完成后可删除这两行 ----
      - V1_DATA_DIR=/app/v1-data
    volumes:
      - ./data:/app/v1-data:ro

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 与业务时区保持一致：首次升级时的日汇总回填（FROM_UNIXTIME）按 MySQL 会话时区划日。
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR 私有镜像：把 docker login 的凭证挂给 watchtower
      #（用 sudo docker login 登录的话凭证在 /root/.docker/config.json）
      - /root/.docker/config.json:/config.json:ro
    environment:
      # 新版 Docker 守护进程要求 API >= 1.40，watchtower 默认协商值过老
      - DOCKER_API_VERSION=1.44
    # 每分钟检查一次 relay-monitor 的新镜像，更新后清理旧镜像
    command: --cleanup --interval 60 relay-monitor
